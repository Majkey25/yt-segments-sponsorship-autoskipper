<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>YouTube Skipper</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main class="panel">
    <header class="hero">
      <div class="brand">
        <img src="icons/icon-48.png" width="42" height="42" alt="">
        <div>
          <div class="eyebrow">SEGMENT SKIPPING</div>
          <h1>YouTube Skipper</h1>
          <p>SponsorBlock controls for YouTube.</p>
        </div>
      </div>
      <div class="theme-toggle" role="group" aria-label="Popup theme">
        <button class="theme-button" type="button" data-theme-value="light" aria-label="Light theme" aria-pressed="false" title="Light">
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <circle cx="12" cy="12" r="4"></circle>
            <path d="M12 2v2M12 20v2M4.93 4.93l1.42 1.42M17.65 17.65l1.42 1.42M2 12h2M20 12h2M4.93 19.07l1.42-1.42M17.65 6.35l1.42-1.42"></path>
          </svg>
        </button>
        <button class="theme-button" type="button" data-theme-value="dark" aria-label="Dark theme" aria-pressed="false" title="Dark">
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path d="M20 15.5A8 8 0 1 1 8.5 4 6 6 0 0 0 20 15.5Z"></path>
          </svg>
        </button>
        <button class="theme-button" type="button" data-theme-value="system" aria-label="System theme" aria-pressed="false" title="System">
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <rect x="3" y="4" width="18" height="13" rx="1"></rect>
            <path d="M8 21h8M12 17v4"></path>
          </svg>
        </button>
      </div>
    </header>

    <section>
      <div class="section-heading">
        <span>Segment skipping</span>
        <span class="section-note">YouTube only</span>
      </div>

      <label class="feature-row">
        <span class="feature-copy">
          <strong>Enable skipping</strong>
          <small>Use community-reported segment timestamps.</small>
        </span>
        <span class="switch">
          <input id="youtubeEnabled" type="checkbox" aria-label="Enable YouTube segment skipping">
          <span></span>
        </span>
      </label>

      <div class="inline-options">
        <label><input id="showMarkers" type="checkbox"> Timeline markers</label>
        <label><input id="showToast" type="checkbox"> Skip notices</label>
      </div>

      <div class="subheading">Segment behavior</div>
      <div id="categories" class="categories"></div>
      <button id="youtubeReset" class="reset" type="button">Reset defaults</button>
    </section>

    <footer>
      <span>Segment data by</span>
      <a href="https://sponsor.ajay.app/" target="_blank" rel="noreferrer">SponsorBlock</a>
    </footer>
  </main>

  <script src="lib/settings.js"></script>
  <script src="popup.js"></script>
</body>
</html>
