name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: npm install --no-package-lock

      - name: Run tests
        run: npm test

      - name: Build extension
        run: npm run build

      - name: Package extension
        run: npm run package

      - name: Verify release archive root
        shell: bash
        run: |
          unzip -Z1 dist/release/yt-segments-sponsorship-autoskipper.zip | grep -Fx "manifest.json"
          test -f dist/extension/manifest.json
          test -f dist/extension/background.js
          test -f dist/extension/adguard-content.js
          test -f dist/extension/adguard-assistant.js
          test -f dist/extension/blocking-page.html
          test -f dist/extension/filters/catalog.json
          node -e "const m=require('./dist/extension/manifest.json'); const r=m.declarative_net_request?.rule_resources||[]; if(r.length < 2 || r.length > 100) process.exit(1)"
